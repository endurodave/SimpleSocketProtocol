name=SimpleSocketProtocol
version=1.2.0
author=David Lafreniere
maintainer=David Lafreniere <endurodave.dev@gmail.com>
sentence=Socket-based binary protocol for UART and other serial links between CPUs, with ACK/NAK, retries and CRC.
paragraph=Simple Socket Protocol (SSP) sends messages between sockets over any byte link: UART, USB serial, SPI. Every message is CRC-checked and ACKed, and resent until the other side ACKs. Portable C with a small hardware/OS layer; also runs on Windows and Linux, so a board can talk to a PC program built from the same code.
category=Communication
