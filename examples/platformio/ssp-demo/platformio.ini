; Simple Socket Protocol (SSP) PlatformIO example, also the board build matrix.
;
;   pio run                                   build every board below
;   pio run -e megaatmega2560 -t upload -t monitor
;   pio run -e native -t exec                 build and run on the desktop
;
; Copying this example into your own project? Change lib_deps to
;   lib_deps = endurodave/SimpleSocketProtocol@^1.1.1
; (here it points at this repository so every commit is tested).
;
; SSP port 1 = Serial1, port 2 = Serial2 (see src/main.cpp for the wiring).
; The *_loopback environments need no wiring: -DSSP_HAL=SSP_HAL_MEM_BUF loops
; the two ports back in memory.

[env]
lib_deps = symlink://../../..
monitor_speed = 115200

; Arduino Mega 2560 (AVR): jumper TX1 (18) -> RX2 (17) and TX2 (16) -> RX1 (19)
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; Arduino Mega 2560, ports looped back in memory: no wiring needed
[env:megaatmega2560_loopback]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -DSSP_HAL=SSP_HAL_MEM_BUF

; Arduino Due (SAM3X8E Cortex-M3): jumper TX1 (18) -> RX2 (17) and TX2 (16) -> RX1 (19)
[env:due]
platform = atmelsam
board = due
framework = arduino

; ESP32, ports looped back in memory
[env:esp32dev_loopback]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DSSP_HAL=SSP_HAL_MEM_BUF

; Desktop (Linux, macOS, or Windows with MinGW): ports looped back in memory
[env:native]
platform = native
