; Simple Socket Protocol (SSP) device example: the board side of a PC link.
; Flash a board, then run examples/pc-host on the PC with the board's serial
; port, e.g. "ssp-pc-host COM6" or "ssp-pc-host /dev/ttyACM0".
;
;   pio run -e megaatmega2560 -t upload
;
; Copying this example into your own project? Change lib_deps to
;   lib_deps = endurodave/SimpleSocketProtocol@^1.2.0
; (here it points at this repository so every commit is tested).
;
; SSP port 1 is mapped to the serial port the PC is on; trace output is off
; because it would go out on the same port.

[env]
lib_deps = symlink://../../..
build_flags = -DSSP_ARDUINO_PORT1=Serial -DSSP_ARDUINO_NO_PORT2 -DSSP_NO_TRACE

; Arduino Mega 2560: SSP over the USB serial port (no wiring)
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = ${env.build_flags} -DDEVICE_NAME=\"mega2560\"

; ESP32: SSP over the USB serial port (no wiring)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = ${env.build_flags} -DDEVICE_NAME=\"esp32\"

; STM32F4 Discovery: its ST-LINK/V2 has no USB serial port, so SSP runs on
; USART6 (TX PC6, RX PC7) to the PC through a 3.3 V USB-UART adapter
[env:disco_f407vg]
platform = ststm32
board = disco_f407vg
framework = arduino
upload_protocol = stlink
build_flags = ${env.build_flags} -DDEVICE_NAME=\"disco_f407vg\"
    -DSERIAL_UART_INSTANCE=6 -DPIN_SERIAL_TX=PC6 -DPIN_SERIAL_RX=PC7
