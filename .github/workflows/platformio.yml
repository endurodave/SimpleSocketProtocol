name: PlatformIO

# Builds the PlatformIO examples for every board in their platformio.ini, and
# runs the native build on the desktop. The examples' lib_deps point at this
# checkout, so each push tests the library as PlatformIO users consume it
# (library.json, srcFilter).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege for GITHUB_TOKEN: these jobs only check out code.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.example }} ${{ matrix.env }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: ssp-demo, env: megaatmega2560 }
          - { example: ssp-demo, env: megaatmega2560_loopback }
          - { example: ssp-demo, env: disco_f407vg_loopback }
          - { example: ssp-demo, env: due }
          - { example: ssp-demo, env: esp32dev_loopback }
          - { example: ssp-demo, env: native }
          - { example: ssp-device, env: megaatmega2560 }
          - { example: ssp-device, env: esp32dev }
          - { example: ssp-device, env: disco_f407vg }

    defaults:
      run:
        working-directory: examples/platformio/${{ matrix.example }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio
        key: pio-${{ matrix.env }}-${{ hashFiles(format('examples/platformio/{0}/platformio.ini', matrix.example)) }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PlatformIO
      run: pip install --upgrade platformio

    - name: Build
      run: pio run -e ${{ matrix.env }}

    - name: Run (native)
      if: matrix.env == 'native'
      run: pio run -e native -t exec
